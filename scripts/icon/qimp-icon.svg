<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- 外圈：一圈细粉环（线宽 35.5 / 画布 1254 ≈ 2.8%），圆心按原稿放在 (624, 621.5) -->
  <circle cx="624" cy="621.5" r="544.75" fill="none" stroke="#FEA8F5" stroke-width="35.5"/>
  <!-- 符梁：一条斜带（slope -0.243），上边缘 x=535 处 y=366、垂直厚度 145，上两角圆角 40 -->
  <path fill="#FEA8F5"
        d="M484,418.4 Q484,378.4 522.9,369.0 L836.1,292.7 Q875,283.3 875,323.3 L875,428.3 L484,523.4 Z"/>
  <!-- 两根符杆：各宽 48（x 484..532 / 827..875）。顶端故意伸进斜带里，免得在圆角处露出方角 -->
  <rect x="484" y="450" width="48" height="402" fill="#FEA8F5"/>
  <rect x="827" y="330" width="48" height="439" fill="#FEA8F5"/>
  <!-- 两个符头：最小二乘拟合出来的圆（半径 108），与符杆相并即原稿那种「凹口」 -->
  <circle cx="423" cy="850" r="108" fill="#FEA8F5"/>
  <circle cx="762" cy="775" r="108" fill="#FEA8F5"/>
</svg>
